[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dino-anomaly-mvtec"
version = "0.2.0"
description = "Multi-layer DINOv2 anomaly detection on MVTec AD"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
